<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudAI</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050805'/%3E%3Cpath d='M43 21C43 15 38 12 32 12 25.5 12 21 15.5 21 21 21 27.5 28 29.5 32 31.5 37 34 43 36 43 43 43 49 38.5 52 32 52 25.5 52 21 48.5 21 43' fill='none' stroke='%232dff7a' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M51 9l1.6 4.4L57 15l-4.4 1.6L51 21l-1.6-4.4L45 15l4.4-1.6z' fill='%23d7f5df'/%3E%3C/svg%3E">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #050805;
      --card: #0d130d;
      --line: #1b2b1b;
      --g: #2dff7a;
      --g2: #14b34f;
      --tx: #d7f5df;
      --mu: #7f9a86;
      --red: #ff5a6a
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(900px 400px at 80% -10%, #0e2a15 0, transparent 60%), var(--bg);
      color: var(--tx);
      font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      min-height: 100vh
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px
    }

    .logo b {
      color: var(--g);
      text-shadow: 0 0 18px #2dff7a88
    }

    .lvl {
      min-width: 170px;
      font-size: 12px;
      color: var(--mu)
    }

    .bar {
      height: 8px;
      background: #0a1a0e;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--g2), var(--g));
      box-shadow: 0 0 10px var(--g);
      transition: width .5s
    }

    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px
    }

    nav button {
      background: var(--card);
      color: var(--mu);
      border: 1px solid var(--line);
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap
    }

    nav button.on {
      color: #021207;
      background: var(--g);
      border-color: var(--g);
      font-weight: 700;
      box-shadow: 0 0 16px #2dff7a55
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--g)
    }

    .big {
      font-size: 32px;
      font-weight: 800;
      color: var(--g)
    }

    .sub {
      color: var(--mu);
      font-size: 12px
    }

    input,
    select,
    textarea {
      background: #070d07;
      border: 1px solid var(--line);
      color: var(--tx);
      padding: 9px 11px;
      border-radius: 9px;
      font: inherit;
      width: 100%;
      margin: 0
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--g);
      box-shadow: 0 0 0 2px #2dff7a33
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px
    }

    .row>* {
      flex: 1;
      min-width: 120px
    }

    .btn {
      background: var(--g);
      color: #021207;
      border: 0;
      padding: 9px 16px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      flex: 0 0 auto
    }

    .btn.o {
      background: transparent;
      color: var(--g);
      border: 1px solid var(--g)
    }

    .btn.x {
      background: transparent;
      color: var(--red);
      border: 1px solid #4a1d24;
      padding: 4px 10px
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line)
    }

    .item:first-of-type {
      border-top: 0
    }

    .item>.t {
      flex: 1;
      min-width: 0
    }

    .item.done .t b {
      text-decoration: line-through;
      color: var(--mu)
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 8px;
      border: 1px solid var(--g2);
      color: var(--g);
      border-radius: 20px;
      margin-right: 6px
    }

    input[type=checkbox],
    input[type=radio] {
      width: auto;
      accent-color: var(--g);
      margin-top: 5px
    }

    .timer {
      font: 800 56px/1 "Courier New", monospace;
      color: var(--g);
      text-shadow: 0 0 22px #2dff7a88;
      text-align: center;
      margin: 12px 0
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 150px
    }

    .bars div {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--mu);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%
    }

    .bars span {
      display: block;
      background: linear-gradient(0deg, var(--g2), var(--g));
      border-radius: 6px 6px 0 0;
      min-height: 2px;
      box-shadow: 0 0 10px #2dff7a55
    }

    .hb {
      display: grid;
      grid-template-columns: 110px 1fr 56px;
      gap: 8px;
      align-items: center;
      margin: 6px 0;
      font-size: 13px
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      background: #070d07;
      color: var(--tx);
      border: 1px solid var(--line);
      padding: 11px;
      border-radius: 10px;
      margin: 6px 0;
      cursor: pointer;
      font: inherit
    }

    .opt:hover {
      border-color: var(--g)
    }

    .opt.ok {
      background: #0b3a1c;
      border-color: var(--g)
    }

    .opt.bad {
      background: #3a0f16;
      border-color: var(--red)
    }

    .empty {
      color: var(--mu);
      text-align: center;
      padding: 18px
    }

    .sync {
      font-size: 11px;
      color: var(--mu)
    }

    /* Novos estilos para matérias e cores */
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, .15);
      box-shadow: 0 0 6px currentColor
    }

    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s
    }

    .color-swatch:hover {
      transform: scale(1.12)
    }

    .color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--g)
    }

    .subj-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--line)
    }

    .subj-item:first-of-type {
      border-top: 0
    }

    .subj-item .info {
      flex: 1;
      min-width: 0
    }

    .subj-item .info b {
      display: block;
      font-size: 15px
    }

    .subj-item .edit-row {
      display: none;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap
    }

    .subj-item.editing .edit-row {
      display: flex
    }

    .subj-item.editing .view-row {
      display: none
    }

    .stacked-bar {
      display: flex;
      height: 100%;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
      min-height: 2px
    }

    .stacked-bar span {
      display: block;
      height: 100%;
      min-width: 2px
    }

    .day-colors {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      margin-top: 2px
    }

    .day-colors i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--mu)
    }

    .inline-edit {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    .inline-edit input[type=text],
    .inline-edit input[type=number] {
      width: auto;
      min-width: 80px;
      flex: 1
    }

    .inline-edit input[type=color] {
      width: 36px;
      height: 36px;
      padding: 2px;
      cursor: pointer;
      border-radius: 8px
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <div class="logo">Stud<b>AI</b></div>
        <div class="sync" id="sync">by Luís</div>
      </div>
      <div class="lvl">
        <div id="lvlTxt"></div>
        <div class="bar"><i id="xpBar"></i></div>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <script>
    const TABS = [["painel", "📊 Painel"], ["materias", "📚 Matérias"], ["metas", "🎯 Metas"], ["tempo", "⏱️ Tempo"], ["quiz", "🧠 Quiz"], ["calendario", "📅 Calendário"], ["dados", "💾 Dados"]];
    const KEY = "studai_v2";
    const PALETTE = ["#2dff7a", "#3b82f6", "#a855f7", "#f59e0b", "#ef4444", "#06b6d4", "#ec4899", "#84cc16", "#f97316", "#8b5cf6", "#14b8a6", "#eab308"];
    let editEntry = null;
    let dr = { c: "", t: "", w: "" }, dm = { c: "", m: "", d: "", t: "", w: "" };
    let S = { subjects: [], topics: [], goals: [], sessions: [], quiz: [], results: [], logs: [] }, tab = "painel", quizState = null, tm = { run: false, start: 0, acc: 0 }, tick = null, dbDoc = null, pm = { run: false, end: 0, phase: "foco", left: 1500, f: 25, b: 5, cat: "" }, calOff = 0, calSel = null, sure = false, exportTxt = "";
    const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const today = () => iso(new Date());
    const fmt = m => m >= 60 ? Math.floor(m / 60) + "h" + String(Math.round(m % 60)).padStart(2, "0") : Math.round(m) + "min";
    const subjByName = n => S.subjects.find(s => s.name.toLowerCase() === (n || "").toLowerCase());
    const subjColor = n => { const s = subjByName(n); return s ? s.color : PALETTE[0]; };
    const sortAlpha = (a, b) => String(a).localeCompare(String(b), "pt-BR", { sensitivity: "base" });
    const sortedSubjects = () => S.subjects.slice().sort((a, b) => sortAlpha(a.name, b.name));
    const cats = () => sortedSubjects().map(s => s.name);
    const catList = () => `<datalist id="cats">${cats().map(c => `<option value="${esc(c)}">`).join("")}</datalist>`;
    const nextColor = () => { const used = new Set(S.subjects.map(s => s.color)); return PALETTE.find(c => !used.has(c)) || PALETTE[S.subjects.length % PALETTE.length]; };

    /* Migração de dados antigos (v1 → v2) */
    function migrate() {
      if (S.subjects.length) return;
      const names = new Set();
      [...S.topics, ...S.sessions, ...S.quiz].forEach(x => { if (x.cat) names.add(x.cat); });
      if (!names.size && S.topics.length === 0 && S.sessions.length === 0) return;
      let i = 0;
      names.forEach(n => {
        S.subjects.push({ id: uid(), name: n, color: PALETTE[i % PALETTE.length] });
        i++;
      });
      if (!S.subjects.length) S.subjects.push({ id: uid(), name: "Geral", color: PALETTE[0] });
    }

    /* persistência */
    try { const r = localStorage.getItem(KEY); if (r) S = { ...S, ...JSON.parse(r) }; } catch (e) { }
    /* fallback v1 */
    if (!S.subjects || !S.subjects.length) {
      try { const old = localStorage.getItem("studai_v1"); if (old) { const o = JSON.parse(old); S = { ...S, ...o }; } } catch (e) { }
    }
    migrate();
    let saveT;
    function save() {
      S._t = Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
      clearTimeout(saveT);
      saveT = setTimeout(async () => { if (!dbDoc) return; try { await dbDoc.set({ payload: JSON.stringify(S), t: S._t }); $("#sync").textContent = "☁ salvo na sua conta"; } catch (e) { } }, 600);
    }
    (async () => {
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if (!db || !user) return; const id = await user.id(); if (!id) return;
        dbDoc = db.collection("data/users/" + id).doc("studai");
        const snap = await dbDoc.get();
        if (snap.exists) { const d = snap.data(); if (d && d.t > (S._t || 0)) { S = { ...S, ...JSON.parse(d.payload) }; migrate(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } render(); } }
        else if (S._t) { await dbDoc.set({ payload: JSON.stringify(S), t: S._t }); }
        $("#sync").textContent = "☁ salvo na sua conta";
      } catch (e) { }
    })();

    /* XP / nível */
    function xp() { const m = S.sessions.reduce((a, s) => a + s.min, 0); return Math.round(m * 2 + (S.logs || []).length * 20 + S.goals.filter(g => g.done).length * 50 + S.results.reduce((a, r) => a + r.score * 10, 0)); }
    function header() { const x = xp(), l = Math.floor(Math.sqrt(x / 50)) + 1, a = 50 * (l - 1) ** 2, b = 50 * l ** 2; $("#lvlTxt").textContent = `Nível ${l} · ${x} XP`; $("#xpBar").style.width = Math.min(100, (x - a) / (b - a) * 100) + "%"; }
    function streak() { const d = new Set(S.sessions.map(s => s.date)); let n = 0, c = new Date(); if (!d.has(iso(c))) c.setDate(c.getDate() - 1); while (d.has(iso(c))) { n++; c.setDate(c.getDate() - 1); } return n; }

    function nav() { $("#nav").innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join(""); }
    function go(k) { tab = k; render(); }
    function render() { S.logs = S.logs || []; nav(); header(); $("#main").innerHTML = ({ painel: vPainel, materias: vMaterias, metas: vMetas, tempo: () => vTempo() + vHist(), quiz: vQuiz, calendario: vCal, dados: vDados })[tab](); if (tab === "tempo") updTimer(); }
    /* ========== MATÉRIAS ========== */
    function ensureSubject(name) {
      if (!name || !name.trim()) return null;
      let s = subjByName(name);
      if (!s) { s = { id: uid(), name: name.trim(), color: nextColor() }; S.subjects.push(s); save(); }
      return s;
    }
    function totalTime(name) {
      return S.sessions.filter(s => (s.cat || "Geral").toLowerCase() === (name || "").toLowerCase()).reduce((a, s) => a + s.min, 0);
    }
    function vMaterias() {
      const list = sortedSubjects();
      return `<div class="card"><h3>Nova matéria</h3>
   <div class="row"><input id="mn" placeholder="Nome da matéria (ex: NetApp)"><div style="flex:0 0 auto"><input type="color" id="mc" value="${nextColor()}" title="Escolher cor" style="width:42px;height:42px;padding:2px;cursor:pointer;border-radius:8px;border:1px solid var(--line)"></div></div>
   <button class="btn" onclick="addSubject()">Adicionar matéria</button></div>
   <div class="card"><h3>Minhas matérias (${list.length})</h3>
${list.length ? list.map(s => {
        return `<div class="subj-item" id="subj-${s.id}">
       <span class="color-dot" style="background:${s.color};color:${s.color}"></span>
       <div class="info">
         <div class="view-row"><b>${esc(s.name)}</b></div>
         <div class="edit-row">
           <input type="text" id="en-${s.id}" value="${esc(s.name)}" placeholder="Nome">
           <input type="color" id="ec-${s.id}" value="${s.color}" style="width:36px;height:36px;padding:2px">
           <input type="number" id="et-${s.id}" min="0" step="1" placeholder="Ajustar min" title="Adiciona ou remove minutos (use negativo para reduzir)" style="width:90px">
           <button class="btn" onclick="saveSubject('${s.id}')">Salvar</button>
           <button class="btn o" onclick="cancelEdit('${s.id}')">Cancelar</button>
         </div>
       </div>
       <button class="btn o" onclick="startEdit('${s.id}')">✎</button>
       <button class="btn x" onclick="delSubject('${s.id}')">✕</button>
     </div>`;
      }).join("") : `<div class="empty">Nenhuma matéria ainda. Crie a primeira!</div>`}
  </div>`;
    }
    function addSubject() {
      const n = $("#mn").value.trim(); if (!n) return;
      if (subjByName(n)) { alert("Já existe uma matéria com esse nome."); return; }
      S.subjects.push({ id: uid(), name: n, color: $("#mc").value || nextColor() });
      save(); render();
    }
    function startEdit(id) {
      document.querySelectorAll(".subj-item").forEach(el => el.classList.remove("editing"));
      const el = document.getElementById("subj-" + id); if (el) el.classList.add("editing");
    }
    function cancelEdit(id) { const el = document.getElementById("subj-" + id); if (el) el.classList.remove("editing"); }
    function saveSubject(id) {
      const s = S.subjects.find(x => x.id === id); if (!s) return;
      const newName = $("#en-" + id).value.trim();
      const newColor = $("#ec-" + id).value;
      const adj = parseFloat($("#et-" + id).value) || 0;
      if (!newName) { alert("Nome não pode ficar vazio."); return; }
      // renomear em todos os lugares
      if (newName !== s.name) {
        const old = s.name;
        S.topics.forEach(t => { if ((t.cat || "") == old) t.cat = newName; });
        S.sessions.forEach(t => { if ((t.cat || "") == old) t.cat = newName; });
        S.quiz.forEach(t => { if ((t.cat || "") == old) t.cat = newName; });
        S.goals.forEach(t => { if ((t.cat || "") == old) t.cat = newName; });
        (S.logs || []).forEach(t => { if ((t.cat || "") == old) t.cat = newName; });
        s.name = newName;
      }
      s.color = newColor;
      // ajuste de tempo: cria sessão positiva ou negativa
      if (adj !== 0) {
        S.sessions.push({ id: uid(), date: today(), min: adj, cat: s.name, note: "ajuste manual" });
      }
      save(); render();
    }
    function delSubject(id) {
      const s = S.subjects.find(x => x.id === id); if (!s) return;
      if (!confirm(`Apagar a matéria "${s.name}"?\nOs conteúdos e sessões continuam, mas ficam sem cor associada.`)) return;
      S.subjects = S.subjects.filter(x => x.id !== id);
      save(); render();
    }

    /* PAINEL */
    function vPainel() {
      const tot = S.sessions.reduce((a, s) => a + s.min, 0), done = S.topics.filter(t => t.done).length;
      const hoje = S.sessions.filter(s => s.date === today()).reduce((a, s) => a + s.min, 0);
      const hojeN = S.sessions.filter(s => s.date === today() && s.min > 0).length;
      const estudouHoje = hojeN > 0;
      const last = [...Array(7)].map((_, i) => {
        const d = new Date(); d.setDate(d.getDate() - 6 + i); const k = iso(d);
        const byCat = {};
        S.sessions.filter(s => s.date === k).forEach(s => {
          const c = s.cat || "Geral";
          byCat[c] = (byCat[c] || 0) + s.min;
        });
        return { k, l: ["D", "S", "T", "Q", "Q", "S", "S"][d.getDay()], m: Object.values(byCat).reduce((a, v) => a + v, 0), byCat };
      });
      const mx = Math.max(1, ...last.map(x => x.m));
      const mesKey = today().slice(0, 7);
      const sessMes = S.sessions.filter(s => (s.date || "").startsWith(mesKey));
      const mesNome = new Date().toLocaleDateString("pt-BR", { month: "long" });
      const byCat = {}; sessMes.forEach(s => byCat[s.cat || "Geral"] = (byCat[s.cat || "Geral"] || 0) + s.min);
      const cm = Math.max(1, ...Object.values(byCat));
      const DAY_L = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const byCatDay = {};
      sessMes.forEach(s => {
        const c = s.cat || "Geral";
        if (!byCatDay[c]) byCatDay[c] = [0, 0, 0, 0, 0, 0, 0];
        const wd = new Date(s.date + "T12:00:00").getDay();
        byCatDay[c][wd] += s.min;
      });

    <h3>Dias da semana mais estudados</h3>
    ${diaHtml || `<div class="empty">Nenhum estudo neste mês</div>`}
    <div class="sub" style="margin-top:8px">O número depois do dia é quantas vezes ele aconteceu no mês (ex.: 3x = três segundas).</div>
  </div>
</div>`;

      return `<div class="card">
  <div class="row" style="align-items:center;flex-wrap:nowrap">
    <button class="btn o" onclick="calOff--;calSel=null;render()">←</button>
    <h3 style="text-align:center;margin:0;flex:3">${b.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</h3>
    <button class="btn o" onclick="calOff++;calSel=null;render()">→</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px">
    ${["D", "S", "T", "Q", "Q", "S", "S"].map(x => `<div class="sub" style="text-align:center">${x}</div>`).join("")}
    ${cells}
  </div>
  <div class="sub" style="margin-top:8px">
    Quanto mais verde, mais você estudou. Bolinhas = matérias do dia. 🎯 = meta pendente · ✅ = meta atingida.
  </div>
  <div class="legend">
    ${sortedSubjects().map(s => `<span><i class="color-dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}
  </div>
</div>${det}${resumo}`;
    }

    /* DADOS */
    function vDados() {
      return `<div class="card"><h3>Exportar</h3><p class="sub">Baixe uma cópia dos seus dados quando quiser.</p><div class="row"><button class="btn" onclick="exp('json')">⬇ Backup completo</button><button class="btn o" onclick="exp('csv')">⬇ Sessões</button><button class="btn o" onclick="exp('md')">⬇ Resumo</button></div></div>
  ${exportTxt ? `<div class="card"><h3>Copie o conteúdo</h3><textarea rows="8" readonly onclick="this.select()">${esc(exportTxt)}</textarea></div>` : ""}
  <div class="card"><h3>Importar backup</h3><input type="file" accept=".json,application/json" onchange="imp(this.files[0])"><div class="sub" id="impMsg" style="margin-top:6px">Substitui os dados atuais pelo conteúdo do backup.</div></div>
  <div class="card"><h3>Zona de perigo</h3><button class="btn x" onclick="wipe()">${sure ? "Clique de novo para confirmar" : "Apagar todos os dados"}</button></div>`;
    }
    async function exp(t) {
      const d = today(); let name, data;
      if (t === "json") { name = "studai-backup-" + d + ".json"; data = JSON.stringify(S, null, 2); }
      else if (t === "csv") { name = "studai-sessoes-" + d + ".csv"; data = "data,minutos,categoria\n" + S.sessions.map(s => [s.date, s.min, '"' + (s.cat || "").replace(/"/g, '""') + '"'].join(",")).join("\n"); }
      else { name = "studai-resumo-" + d + ".md"; data = "# StudAI - resumo (" + d + ")\n\n- Tempo total: " + fmt(S.sessions.reduce((a, s) => a + s.min, 0)) + "\n- Conteúdos concluídos: " + S.topics.filter(t => t.done).length + "/" + S.topics.length + "\n- Testes feitos: " + S.results.length + "\n\n## Matérias\n" + sortedSubjects().map(s => "- " + s.name + " (" + fmt(totalTime(s.name)) + ")").join("\n") + "\n\n## Conteúdos\n" + S.topics.map(t => "- [" + (t.done ? "x" : " ") + "] " + t.title + " (" + (t.cat || "Geral") + ", " + t.date + ")").join("\n") + "\n\n## Metas\n" + S.goals.map(g => "- [" + (g.done ? "x" : " ") + "] " + g.text + (g.due ? " (até " + g.due + ")" : "")).join("\n"); }
      try { const dl = await claude.use("downloads"); if (dl) { await dl.save({ filename: name, data }); return; } } catch (e) { if (e && e.code === "cancelled") return; }
      exportTxt = data; render();
    }
    function imp(f) { if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.topics || !d.sessions) throw 0; S = { subjects: [], topics: [], goals: [], sessions: [], quiz: [], results: [], ...d }; migrate(); save(); render(); $("#impMsg").textContent = "✔ Backup importado!"; } catch (e) { $("#impMsg").textContent = "Arquivo inválido."; } }; r.readAsText(f); }
    function wipe() { if (!sure) { sure = true; render(); return; } sure = false; S = { subjects: [], topics: [], goals: [], sessions: [], quiz: [], results: [], logs: [] }; save(); render(); }

    /* QUIZ */
    function vQuiz() {
      if (quizState && quizState.fin) return `<div class="card" style="text-align:center"><h3>Resultado</h3><div class="big">${quizState.score}/${quizState.qs.length}</div><p>${quizState.score === quizState.qs.length ? "Perfeito! 🏆" : quizState.score / quizState.qs.length >= .6 ? "Bom trabalho! 💪" : "Continue revisando, você chega lá 📈"}</p><button class="btn" onclick="quizState=null;render()">Voltar</button></div>`;
      if (quizState) {
        const q = quizState.qs[quizState.i], a = quizState.ans;
        return `<div class="card"><h3>Pergunta ${quizState.i + 1} de ${quizState.qs.length}</h3><div class="bar" style="margin-bottom:12px"><i style="width:${quizState.i / quizState.qs.length * 100}%"></i></div><p style="font-size:18px"><b>${esc(q.q)}</b></p>${q.opts.map((o, i) => `<button class="opt ${a !== null ? (i === q.ans ? "ok" : i === a ? "bad" : "") : ""}" ${a !== null ? "disabled" : ""} onclick="answer(${i})">${esc(o)}</button>`).join("")}${a !== null ? `<button class="btn" style="margin-top:10px" onclick="nextQ()">${quizState.i + 1 < quizState.qs.length ? "Próxima →" : "Ver resultado"}</button>` : ""}</div>`;
      }
      return `<div class="card"><h3>Fazer um teste</h3>${S.quiz.length ? `<div class="row"><select id="qf"><option value="">Todas as matérias</option>${[...new Set(S.quiz.map(q => q.cat).filter(Boolean))].sort(sortAlpha).map(c => `<option>${esc(c)}</option>`).join("")}</select><button class="btn" onclick="startQuiz()">Começar</button></div>` : `<div class="empty">Crie perguntas abaixo (ou carregue exemplos) para se testar</div>`}
  ${due().length ? `<div class="row"><button class="btn" onclick="startQuiz('rev')">🔁 Revisão do dia (${due().length})</button></div><div class="sub" style="margin-bottom:8px">Repetição espaçada: o que você erra volta logo, o que acerta volta cada vez mais espaçado.</div>` : ""}<button class="btn o" onclick="samples()">+ Carregar 3 perguntas de exemplo</button></div>
  <div class="card"><h3>Nova pergunta</h3>${catList()}<div class="row"><input id="qq" placeholder="Pergunta"><input id="qc" list="cats" placeholder="Matéria"></div>
  ${[0, 1, 2, 3].map(i => `<div class="row" style="flex-wrap:nowrap;align-items:center"><input type="radio" name="cr" value="${i}" ${i === 0 ? "checked" : ""} style="flex:0"><input id="qo${i}" placeholder="Alternativa ${i + 1}${i === 0 ? " (marque a correta ao lado)" : ""}"></div>`).join("")}
  <button class="btn" onclick="addQ()">Salvar pergunta</button></div>
  <div class="card"><h3>Banco de perguntas (${S.quiz.length})</h3>${S.quiz.map(q => `<div class="item"><div class="t"><b>${esc(q.q)}</b><br><span class="tag" style="border-color:${subjColor(q.cat)};color:${subjColor(q.cat)}">${esc(q.cat || "Geral")}</span><span class="sub">✔ ${esc(q.opts[q.ans])}${q.due ? " · revisão " + q.due.split("-").reverse().join("/") : ""}</span></div><button class="btn x" onclick="del('quiz','${q.id}')">✕</button></div>`).join("") || `<div class="empty">Vazio</div>`}</div>`;
    }
    function addQ() { const q = $("#qq").value.trim(), o = [0, 1, 2, 3].map(i => $("#qo" + i).value.trim()); if (!q || o.filter(Boolean).length < 2) return; const a = +document.querySelector("[name=cr]:checked").value; if (!o[a]) return; const idx = []; const opts = []; o.forEach((x, i) => { if (x) { if (i === a) idx.push(opts.length); opts.push(x); } }); const cat = $("#qc").value.trim(); if (cat) ensureSubject(cat); S.quiz.push({ id: uid(), q, cat, opts, ans: idx[0] }); save(); render(); }
    function samples() { S.quiz.push({ id: uid(), q: "Qual o valor de 7 × 8?", cat: "Matemática", opts: ["54", "56", "64", "48"], ans: 1 }, { id: uid(), q: "Quem escreveu 'Dom Casmurro'?", cat: "Literatura", opts: ["José de Alencar", "Machado de Assis", "Clarice Lispector", "Graciliano Ramos"], ans: 1 }, { id: uid(), q: "Qual a capital do Brasil?", cat: "Geografia", opts: ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], ans: 2 });["Matemática", "Literatura", "Geografia"].forEach(n => ensureSubject(n)); save(); render(); }
    function due() { return S.quiz.filter(q => !q.due || q.due <= today()); }
    function startQuiz(m) { const c = m === "rev" ? "" : $("#qf").value; let qs = (m === "rev" ? due() : S.quiz.filter(q => !c || q.cat === c)).map(q => { const o = q.opts.map((t, i) => ({ t, c: i === q.ans })).sort(() => Math.random() - .5); return { id: q.id, q: q.q, opts: o.map(x => x.t), ans: o.findIndex(x => x.c), cat: q.cat }; }).sort(() => Math.random() - .5); quizState = { qs, i: 0, score: 0, ans: null, cat: c }; render(); }
    function answer(i) { const q = quizState.qs[quizState.i], ok = i === q.ans; quizState.ans = i; if (ok) quizState.score++; const o = S.quiz.find(x => x.id === q.id); if (o) { const IV = [1, 3, 7, 16]; o.box = ok ? Math.min(4, (o.box || 0) + 1) : 0; const d = new Date(); d.setDate(d.getDate() + (ok ? IV[o.box - 1] : 0)); o.due = iso(d); save(); } render(); }
    function nextQ() { if (quizState.i + 1 < quizState.qs.length) { quizState.i++; quizState.ans = null; } else { quizState.fin = true; S.results.push({ date: today(), cat: quizState.cat, score: quizState.score, total: quizState.qs.length }); save(); } render(); }
    render();
  </script>
</body>

</html>
