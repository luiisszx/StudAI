<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
    content="StudAI - Plataforma moderna de gestão de estudos com Pomodoro, Kanban, Gamificação por XP e Quiz Inteligente com IA.">
  <meta name="theme-color" content="#050805">
  <title>StudAI · Gestão Inteligente de Estudos</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050805'/%3E%3Cpath d='M43 21C43 15 38 12 32 12 25.5 12 21 15.5 21 21 21 27.5 28 29.5 32 31.5 37 34 43 36 43 43 43 49 38.5 52 32 52 25.5 52 21 48.5 21 43' fill='none' stroke='%232dff7a' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M51 9l1.6 4.4L57 15l-4.4 1.6L51 21l-1.6-4.4L45 15l4.4-1.6z' fill='%23d7f5df'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="wrap">
    <header role="banner">
      <div>
        <h1 class="logo">Stud<b>AI</b></h1>
        <div class="sync" id="sync">by Luís</div>
      </div>
      <div class="lvl" aria-label="Progresso de nível e XP">
        <div id="lvlTxt">Carregando nível...</div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="xpBar" style="width: 0%"></i>
        </div>
      </div>
    </header>
    <nav id="nav" aria-label="Navegação principal"></nav>
    <main id="main" role="main"></main>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
